# XcodeGen spec — optional. Generates Reclaim.xcodeproj for building a
# distributable .app bundle. Day-to-day development works without it:
# `open Package.swift` or `swift run Reclaim`.
#
#   brew install xcodegen && xcodegen

name: Reclaim

options:
  bundleIdPrefix: com.allwiine
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  ReclaimPackage:
    path: .

targets:
  Reclaim:
    type: application
    platform: macOS
    sources:
      - path: Sources/Reclaim
      # App icon — asset catalog lives at the repo root because the SPM
      # targets never compile it; only the generated app target does.
      - path: Assets.xcassets
    dependencies:
      - package: ReclaimPackage
        product: ReclaimKit
      - package: ReclaimPackage
        product: ReclaimAppCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.allwiine.reclaim
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # Reclaim asks Finder (via Apple events) to empty the Trash so
        # freed space becomes available; both the usage string and the
        # automation entitlement below are required for that to work in
        # a hardened-runtime build.
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "Reclaim asks Finder to empty the Trash so freed space becomes available."
        # Direct distribution: hardened runtime on, sandbox off (the app's
        # purpose is scanning arbitrary cache locations under $HOME).
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    entitlements:
      path: Reclaim.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    # Localization: the string tables live in the SPM targets' resource
    # bundles ({en,nb}.lproj). The app-level Info.plist must still declare
    # the supported languages so macOS offers per-app language selection,
    # and allow mixed localizations so the nested SPM bundles resolve
    # against the user's preferred language.
    info:
      path: Reclaim-Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, nb]
        CFBundleAllowMixedLocalizations: true
