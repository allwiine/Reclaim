# Tag-triggered release: sign (Developer ID), notarize, package a DMG,
# generate the Sparkle appcast, publish a GitHub release. A hyphenated
# tag (v1.0.0-rc.1) publishes as a prerelease, which the stable
# releases/latest/download/appcast.xml URL ignores — safe end-to-end
# rehearsal. workflow_dispatch runs everything except publishing.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    # Dispatch runs are always rehearsals and never publish, regardless of
    # any input parameters (a dispatch has no tag, so it would publish a
    # bogus v0.0.0).
  workflow_call:
    # Invoked by release-please.yml after a Release PR merge created a
    # draft release. The build publishes into that existing draft.
    inputs:
      tag:
        description: "Tag of the existing draft release to build and publish (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, notarize & publish
    runs-on: macos-26
    # Two notarization round-trips (app, then DMG) can be slow on Apple's
    # side; generous but bounded.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | grep -vi beta | sort -V | tail -1)/Contents/Developer"

      - name: Test
        run: swift test

      - name: Install tools
        run: brew install xcodegen create-dmg

      - name: Derive version from tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # Precedence: workflow_call input (release-please chain), then a
          # direct tag push, else a versionless rehearsal. In a called
          # workflow EVENT_NAME is the CALLER's event ("push" to main) and
          # GITHUB_REF_NAME is "main", so the push branch must also check
          # that the ref is actually a tag.
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "$EVENT_NAME" = "push" ] && [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v0.0.0"
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Tag '$TAG' does not match vX.Y.Z or vX.Y.Z-<prerelease>"
            exit 1
          fi
          VERSION="${TAG#v}"
          BUILD_VERSION="${VERSION%%-*}"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "build_version=$BUILD_VERSION"
            case "$VERSION" in
              *-*) echo "prerelease=true" ;;
              *)   echo "prerelease=false" ;;
            esac
          } >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          printf '%s' "$CERT_P12" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"

      - name: Archive and export
        env:
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
        run: |
          xcodegen
          # -scheme ReclaimApp, not Reclaim: the SPM package's executable
          # product is also named "Reclaim", and xcodebuild's pick between
          # the two same-named autocreated schemes is nondeterministic — the
          # package one archives a bare executable with no .app, which makes
          # -exportArchive fail with an empty distribution-method set.
          xcodebuild -project Reclaim.xcodeproj -scheme ReclaimApp -configuration Release \
            -destination "generic/platform=macOS" \
            archive -archivePath "$RUNNER_TEMP/Reclaim.xcarchive" \
            MARKETING_VERSION="$BUILD_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_VERSION" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM=U6RN2FGE8Z
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Reclaim.xcarchive" \
            -exportOptionsPlist .github/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export"
          codesign --verify --strict --verbose=2 "$RUNNER_TEMP/export/Reclaim.app"
          codesign -d --verbose=2 "$RUNNER_TEMP/export/Reclaim.app" 2>&1 | grep -q "flags=.*runtime" \
            || { echo "::error::Hardened runtime missing on exported app"; exit 1; }

      - name: Notarize and staple app
        # The DMG notarization below covers the container, but the .app it
        # carries needs its own stapled ticket: users copy the app out of
        # the DMG, and an unstapled app validates poorly on an offline
        # first launch. A ticket can only be stapled after the app itself
        # passes notarization, and the DMG snapshots the app when it is
        # built — so the order is: notarize app (zipped) → staple app →
        # package DMG → notarize DMG → staple DMG.
        env:
          ASC_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent "$RUNNER_TEMP/export/Reclaim.app" "$RUNNER_TEMP/Reclaim-app.zip"
          set +e
          RESULT="$(xcrun notarytool submit "$RUNNER_TEMP/Reclaim-app.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --wait --timeout 30m --output-format json)"
          SUBMIT_EXIT=$?
          set -e
          echo "$RESULT"
          STATUS="$(echo "$RESULT" | jq -r '.status // empty')"
          SUBMISSION_ID="$(echo "$RESULT" | jq -r '.id // empty')"
          if [ "$SUBMIT_EXIT" -ne 0 ] || [ "$STATUS" != "Accepted" ]; then
            echo "::error::App notarization failed (exit $SUBMIT_EXIT, status ${STATUS:-unknown}) — full log follows"
            if [ -n "$SUBMISSION_ID" ]; then
              xcrun notarytool log "$SUBMISSION_ID" \
                --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" || true
            fi
            rm -f "$RUNNER_TEMP/AuthKey.p8"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/Reclaim-app.zip"
          xcrun stapler staple "$RUNNER_TEMP/export/Reclaim.app"
          xcrun stapler validate "$RUNNER_TEMP/export/Reclaim.app"

      - name: Package DMG
        id: dmg
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          DMG="Reclaim-$VERSION.dmg"
          create-dmg \
            --volname "Reclaim" \
            --window-size 540 380 \
            --icon-size 128 \
            --icon "Reclaim.app" 140 180 \
            --app-drop-link 400 180 \
            --hide-extension "Reclaim.app" \
            "$DMG" "$RUNNER_TEMP/export/Reclaim.app"
          codesign --force --sign "Developer ID Application" --timestamp "$DMG"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"

      - name: Notarize and staple DMG
        env:
          ASC_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          DMG: ${{ steps.dmg.outputs.dmg }}
        run: |
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          set +e
          RESULT="$(xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --wait --timeout 30m --output-format json)"
          SUBMIT_EXIT=$?
          set -e
          echo "$RESULT"
          STATUS="$(echo "$RESULT" | jq -r '.status // empty')"
          SUBMISSION_ID="$(echo "$RESULT" | jq -r '.id // empty')"
          if [ "$SUBMIT_EXIT" -ne 0 ] || [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization failed (exit $SUBMIT_EXIT, status ${STATUS:-unknown}) — full log follows"
            if [ -n "$SUBMISSION_ID" ]; then
              xcrun notarytool log "$SUBMISSION_ID" \
                --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" || true
            fi
            rm -f "$RUNNER_TEMP/AuthKey.p8"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          xcrun stapler staple "$DMG"

      - name: Generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAG: ${{ steps.version.outputs.tag }}
          DMG: ${{ steps.dmg.outputs.dmg }}
        run: |
          # Sparkle version pinned in sync with project.yml (exactVersion).
          curl -fsSL -o "$RUNNER_TEMP/Sparkle.tar.xz" \
            https://github.com/sparkle-project/Sparkle/releases/download/2.9.6/Sparkle-2.9.6.tar.xz
          # This runner holds the Sparkle EdDSA signing key, so the
          # generate_appcast binary it runs must be exactly the pinned
          # release — verify the tarball before extracting anything.
          echo "52bf9e88cdd972fc0c81501377a880e90d47031bd8ca5462488f843e2609e192  $RUNNER_TEMP/Sparkle.tar.xz" \
            | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sparkle" && tar -xf "$RUNNER_TEMP/Sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_key"
          mkdir -p "$RUNNER_TEMP/appcast"
          cp "$DMG" "$RUNNER_TEMP/appcast/"
          "$RUNNER_TEMP/sparkle/bin/generate_appcast" \
            --ed-key-file "$RUNNER_TEMP/sparkle_key" \
            --download-url-prefix "https://github.com/allwiine/Reclaim/releases/download/$TAG/" \
            --link "https://github.com/allwiine/Reclaim/releases" \
            --full-release-notes-url "https://github.com/allwiine/Reclaim/releases/tag/$TAG" \
            -o "$RUNNER_TEMP/appcast/appcast.xml" \
            "$RUNNER_TEMP/appcast"
          rm "$RUNNER_TEMP/sparkle_key"
          cat "$RUNNER_TEMP/appcast/appcast.xml"

      - name: Upload rehearsal artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rehearsal-dmg-and-appcast
          path: |
            Reclaim-*.dmg
            ${{ runner.temp }}/appcast/appcast.xml

      - name: Publish release
        # Publishes on real tag pushes and on workflow_call from
        # release-please (the caller's event is a push to main).
        # workflow_dispatch is always a rehearsal and never publishes.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          DMG: ${{ steps.dmg.outputs.dmg }}
        run: |
          if gh release view "$TAG" --json isDraft > /dev/null 2>&1; then
            # Draft created by release-please — attach assets and go live.
            # --clobber keeps a re-run of a half-failed publish idempotent.
            gh release upload "$TAG" --clobber \
              "$DMG" \
              "$RUNNER_TEMP/appcast/appcast.xml"
            gh release edit "$TAG" --draft=false
          else
            EXTRA=""
            if [ "$PRERELEASE" = "true" ]; then
              EXTRA="--prerelease"
            fi
            gh release create "$TAG" \
              --draft \
              --title "Reclaim $VERSION" \
              --generate-notes $EXTRA \
              "$DMG" \
              "$RUNNER_TEMP/appcast/appcast.xml"
            gh release edit "$TAG" --draft=false
          fi

      - name: Remove signing keychain
        if: always()
        run: |
          if [ -n "$KEYCHAIN" ] && [ -f "$KEYCHAIN" ]; then
            security list-keychains -d user -s login.keychain-db
            security delete-keychain "$KEYCHAIN"
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/sparkle_key"
