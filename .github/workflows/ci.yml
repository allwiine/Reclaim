# Build and test on every push and pull request. The registry
# convention tests only protect the catalogue if something runs them
# on every change — this is that something.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the repo; anything needing more must ask per-job.
permissions:
  contents: read

# A newer push to the same branch/PR supersedes the running build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Swift 6.2 needs Xcode 26; pick the newest non-beta Xcode on the
      # image — same selection as release.yml, so CI validates the exact
      # toolchain releases are built with.
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | grep -vi beta | sort -V | tail -1)/Contents/Developer"

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  app:
    name: Xcode app build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | grep -vi beta | sort -V | tail -1)/Contents/Developer"

      # The generated app target mirrors Package.swift's Swift settings
      # by hand (project.yml's "Swift settings mirror" block). Plain
      # `swift build` cannot see that mirror drift — only building the
      # xcodegen project can, and release day is the wrong time to
      # find out. Signing is disabled: this job proves compilation,
      # release.yml owns the signed archive.
      - name: Generate project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen

      - name: Build app target
        run: xcodebuild -project Reclaim.xcodeproj -scheme ReclaimApp -configuration Release build CODE_SIGNING_ALLOWED=NO

  lint:
    name: SwiftLint
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pin the exact SwiftLint release the repo is calibrated against —
      # file_length counting has changed between releases, so an unpinned
      # linter drifts the 200-code-line gate. Bump deliberately, never
      # implicitly.
      - name: Install SwiftLint 0.59.1
        run: |
          curl -fsSL -o swiftlint.zip https://github.com/realm/SwiftLint/releases/download/0.59.1/portable_swiftlint.zip
          echo "58f9be8a4677900c945e2c618168223f4dd620a0cc65c9ccc5ea0f70433e89c1  swiftlint.zip" | shasum -a 256 -c
          unzip -o -q swiftlint.zip -d "$RUNNER_TEMP/swiftlint"

      - name: SwiftLint
        run: '"$RUNNER_TEMP/swiftlint/swiftlint" lint --strict --reporter github-actions-logging'
