# Build and test on every push and pull request. The registry
# convention tests only protect the catalogue if something runs them
# on every change — this is that something.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the repo; anything needing more must ask per-job.
permissions:
  contents: read

# A newer push to the same branch/PR supersedes the running build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Swift 6.2 needs Xcode 26; pick the newest non-beta Xcode on the
      # image — same selection as release.yml, so CI validates the exact
      # toolchain releases are built with.
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | grep -vi beta | sort -V | tail -1)/Contents/Developer"

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test
