# Build and test on every push and pull request. The registry
# convention tests only protect the catalogue if something runs them
# on every change — this is that something.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build & test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Swift 6.2 needs Xcode 26; pick the newest Xcode on the image.
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test
