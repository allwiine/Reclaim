# Pre-commit gate: the 200-code-line file limit plus the design-token
# boundary rules (.swiftlint.yml's file_length and custom_rules).
# One-time setup after cloning: `lefthook install`.
pre-commit:
  commands:
    swiftlint:
      glob: "*.swift"
      run: swiftlint lint --strict --quiet {staged_files}
